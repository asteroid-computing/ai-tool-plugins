schema_version: "1.1"
name: new-clinic-booking-design
expected_outcome: |
  design.md holds a DynamoDB design for a clinic booking app. It lists the access patterns before it designs keys, decides the table boundaries with a reason, and gives an entity chart and an access-pattern chart. Uniqueness of email and phone, the no-double-booking rule and the monthly count are enforced by keys, conditions and transactions, not by reads before writes or queries that count.
